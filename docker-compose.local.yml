services:
  django:
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8001
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
  celeryworker:
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    command: uv run celery -A config.celery_app worker -l INFO
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - django
      - redis
  celerybeat:
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    command: uv run celery -A config.celery_app beat -l INFO
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
volumes:
  local_postgres_data:
