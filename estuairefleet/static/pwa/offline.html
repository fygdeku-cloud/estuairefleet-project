<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C8102E">
    <title>Hors connexion — EstuaireFleet</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f8f8f8; color: #1a1a1a; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 460px); border: 1px solid #e5e5e5; border-radius: 24px; background: #fff; padding: 32px; box-shadow: 0 18px 50px rgb(26 26 26 / 10%); text-align: center; }
      .mark { display: grid; width: 56px; height: 56px; margin: 0 auto 20px; place-items: center; border-radius: 16px; background: #c8102e; color: #fff; font-weight: 800; letter-spacing: .08em; }
      h1 { margin: 0 0 12px; font-size: 1.7rem; }
      p { margin: 0; color: #4a4a4a; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 12px; background: #c8102e; color: #fff; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">EF</div>
      <h1>Vous êtes hors connexion</h1>
      <p>Les écrans déjà ouverts restent disponibles. Reconnectez-vous pour envoyer un signal ou actualiser la carte.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
