<section class="rounded-3xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center shadow-soft"><h2 class="text-xl font-bold text-slate-950">{{ title|default:'Aucun élément' }}</h2><p class="mx-auto mt-2 max-w-md text-sm text-slate-500">{{ message|default:'Aucune donnée à afficher pour le moment.' }}</p>{% if action_url %}<a class="mt-5 inline-flex rounded-xl bg-insam-600 px-4 py-3 text-sm font-bold text-white hover:bg-insam-700" href="{{ action_url }}">{{ action_label|default:'Continuer' }}</a>{% endif %}</section>
