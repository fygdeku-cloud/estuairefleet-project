{% extends "base.html" %}
{% block title %}Mot de passe modifié — EstuaireFleet{% endblock %}
{% block content %}
  <section class="mx-auto max-w-xl rounded-[2rem] border border-slate-200 bg-white px-6 py-16 text-center shadow-soft" aria-labelledby="reset-complete-title">
    <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-emerald-50 text-emerald-600" aria-hidden="true">✓</div>
    <h1 id="reset-complete-title" class="mt-5 text-2xl font-bold text-slate-950">Mot de passe modifié</h1>
    <p class="mt-3 text-sm leading-6 text-slate-500">Votre mot de passe a été enregistré. Vous pouvez maintenant vous reconnecter.</p>
    <a class="mt-7 inline-flex w-full items-center justify-center rounded-xl bg-insam-600 px-5 py-3.5 text-sm font-bold text-white shadow-lg shadow-insam-600/20 transition hover:bg-insam-700" href="{% url 'users:login' %}">Se connecter <span class="ml-2">→</span></a>
  </section>
{% endblock %}
