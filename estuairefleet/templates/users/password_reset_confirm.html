{% extends "base.html" %}{% block title %}Choisir un mot de passe — EstuaireFleet{% endblock %}{% block content %}<section class="mx-auto max-w-xl rounded-3xl border border-slate-200 bg-white p-6 shadow-soft sm:p-8"><h1 class="text-3xl font-bold tracking-tight text-slate-950">Nouveau mot de passe</h1><form method="post" class="mt-8 space-y-5">{% csrf_token %}{% for field in form %}<div><label class="mb-2 block text-sm font-bold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="mt-2 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}</div>{% endfor %}<button class="inline-flex items-center justify-center rounded-xl bg-insam-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-insam-600/20 transition hover:bg-insam-700" type="submit">Enregistrer</button></form></section>{% endblock %}
