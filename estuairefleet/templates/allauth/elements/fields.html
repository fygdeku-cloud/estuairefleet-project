{% for field in attrs.form %}<div class="mb-5"><label class="mb-2 block text-sm font-semibold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="mt-2 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}</div>{% endfor %}
