{% load allauth %}

{% if attrs.type == "textarea" %}
  <div class="mb-5">
      <label for="{{ attrs.id }}">
        {% slot label %}
      {% endslot %}
    </label>
  </div>
    <textarea {% if attrs.required %}required{% endif %}
            {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
            {% if attrs.disabled %}disabled{% endif %}
            {% if attrs.readonly %}readonly{% endif %}
            {% if attrs.checked %}checked{% endif %}
            {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
            {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
            {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
            class="block w-full rounded-xl border border-slate-200 px-4 py-3 text-sm shadow-sm outline-none focus:border-insam-600 focus:ring-4 focus:ring-insam-100">{% slot value %}{% endslot %}</textarea>
  </div>
{% elif attrs.type == "radio" %}
<div class="mb-5">
    <div class="flex items-center gap-3">
      <input {% if attrs.required %}required{% endif %}
             {% if attrs.disabled %}disabled{% endif %}
             {% if attrs.readonly %}readonly{% endif %}
             {% if attrs.checked %}checked{% endif %}
             {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
             {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
             {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
             {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
             value="{{ attrs.value|default_if_none:"" }}"
             type="{{ attrs.type }}" class="h-4 w-4 border-slate-300 text-insam-600 focus:ring-insam-500" />
      <label class="text-sm font-semibold text-slate-700" for="{{ attrs.id }}">
        {% slot label %}
      {% endslot %}
    </label>
</div>
{% else %}
<div class="mb-5">
  <label for="{{ attrs.id }}">
    {% slot label %}
  {% endslot %}
</label>
  <input {% if attrs.required %}required{% endif %}
         {% if attrs.disabled %}disabled{% endif %}
         {% if attrs.readonly %}readonly{% endif %}
         {% if attrs.checked %}checked{% endif %}
         {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
         {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
         {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
         {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
         value="{{ attrs.value|default_if_none:"" }}"
         type="{{ attrs.type }}"
         class="block w-full rounded-xl border border-slate-200 px-4 py-3 text-sm shadow-sm outline-none focus:border-insam-600 focus:ring-4 focus:ring-insam-100" />
</div>
{% endif %}
{% if slots.help_text %}
  <div class="-mt-3 mb-4 text-xs text-slate-400">{% slot help_text %}{% endslot %}</div>
{% endif %}
