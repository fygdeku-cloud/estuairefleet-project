{% load allauth %}

<section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
      <h2 class="text-xl font-bold text-slate-950">
        {% slot title %}
      {% endslot %}
    </h2>
    {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <ul>
      {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
    </ul>
  {% endif %}
</section>
