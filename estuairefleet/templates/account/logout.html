{% extends "base.html" %}
{% block title %}Déconnexion — EstuaireFleet{% endblock %}
{% block content %}
  <section class="mx-auto max-w-xl py-8 sm:py-16"><div class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-soft"><div class="relative bg-slate-950 px-6 py-10 text-center text-white sm:px-10"><div class="absolute -right-14 -top-20 h-48 w-48 rounded-full bg-insam-600/30 blur-3xl"></div><div class="relative mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-insam-600 shadow-xl shadow-insam-600/30"><svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12H3m0 0 4-4m-4 4 4 4m5-9V5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-2" /></svg></div><h1 class="relative mt-6 text-3xl font-bold tracking-tight">Prêt à partir ?</h1><p class="relative mt-3 text-sm leading-6 text-slate-300">Votre session restera protégée. Vous pourrez vous reconnecter avec votre e-mail ou votre matricule.</p></div><div class="p-6 sm:p-8"><form method="post" class="flex flex-col gap-3 sm:flex-row-reverse">{% csrf_token %}<button class="inline-flex flex-1 items-center justify-center rounded-xl bg-insam-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-insam-600/20 transition hover:bg-insam-700" type="submit">Oui, me déconnecter</button><a class="inline-flex flex-1 items-center justify-center rounded-xl border border-slate-200 px-5 py-3 text-sm font-bold text-slate-600 transition hover:bg-slate-50" href="{{ request.user.get_absolute_url }}">Rester connecté</a></form></div></div></section>
{% endblock %}
